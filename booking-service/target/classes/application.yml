server:
  port: 8086

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:mysql://localhost:3306/skybooker_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: basic

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

application:
  security:
    jwt:
      secret-key: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTYW1wbGVCYXNlNjRLZXlGb3JTa3lCb29rZXI=
  booking:
    gst-rate: 0.05
    fuel-surcharge-rate: 0.08
    baggage-rate-per-kg: 150
  clients:
    flight-service-url: http://localhost:8083
    passenger-service-url: http://localhost:8085
    seat-service-url: http://localhost:8084

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
