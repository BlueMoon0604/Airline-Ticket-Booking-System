server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: airline-service-airlines
          uri: http://localhost:8082
          predicates:
            - Path=/airlines/**

        - id: airline-service-airports
          uri: http://localhost:8082
          predicates:
            - Path=/airports/**

        - id: flight-service
          uri: http://localhost:8083
          predicates:
            - Path=/flights/**

        - id: seat-service
          uri: http://localhost:8084
          predicates:
            - Path=/seats/**

        - id: passenger-service
          uri: http://localhost:8085
          predicates:
            - Path=/passengers/**

        - id: booking-service
          uri: http://localhost:8086
          predicates:
            - Path=/bookings/**

        - id: payment-service
          uri: http://localhost:8087
          predicates:
            - Path=/payments/**

        - id: notification-service
          uri: http://localhost:8088
          predicates:
            - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    health:
      show-details: always

application:
  security:
    jwt:
      secret-key: VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTYW1wbGVCYXNlNjRLZXlGb3JTa3lCb29rZXI=

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
